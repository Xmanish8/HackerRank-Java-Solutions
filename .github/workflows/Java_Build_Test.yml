name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile all Java files
    run: |
      find . -type f -name "*.java" | while read file; do
        dir=$(dirname "$file")
        javac -d "$dir" "$file" 2>/dev/null || true
      done
        
      - name: Run JUnit tests
        run: |
          # If you have test classes, run them here
          # Adjust package/class names as needed
          java org.junit.runner.JUnitCore MyTestClass || echo "No tests found"

      - name: Checkstyle (code quality)
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: google_checks.xml
          fail_on_error: true
