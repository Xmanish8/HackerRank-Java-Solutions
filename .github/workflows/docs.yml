name: Documentation Update

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.java'

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README
        run: |
          echo "# HackerRank Java Solutions" > README.md
          echo "" >> README.md
          echo "This repo contains solutions to HackerRank Java challenges." >> README.md
          echo "" >> README.md
          echo "## Solutions" >> README.md

          find . -type f -name "Solution.java" -not -path "./.git/*" | sort | while read file; do
            echo "- \`$file\`" >> README.md
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README with new solutions"
          branch: main
